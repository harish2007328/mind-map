<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Transform PDF documents into interactive AI-generated mind maps. Upload, explore, and edit visual knowledge structures.">
    <title>MindMapAI — PDF to Mind Map</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ── Navbar ─────────────────────────────────────── -->
    <nav class="navbar navbar-light border-bottom">
        <div class="container">
            <a class="navbar-brand fw-600" href="index.html">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3366CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-2" style="vertical-align:-4px">
                    <circle cx="12" cy="12" r="3"/><line x1="12" y1="1" x2="12" y2="5"/>
                    <line x1="12" y1="19" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="7.05" y2="7.05"/>
                    <line x1="16.95" y1="16.95" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="5" y2="12"/>
                    <line x1="19" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="7.05" y2="16.95"/>
                    <line x1="16.95" y1="7.05" x2="19.78" y2="4.22"/>
                </svg>
                MindMapAI
            </a>
        </div>
    </nav>

    <main class="container py-5">

        <!-- ── Upload Section ─────────────────────────── -->
        <section class="text-center mb-5">
            <h1 class="display-6 fw-700 mb-2">PDF → Mind Map</h1>
            <p class="text-secondary mb-4">Upload a PDF document and let AI turn it into an interactive mind map.</p>

            <div id="uploadArea" class="upload-area mx-auto">
                <div id="uploadContent">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#3366CC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mb-3">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <p class="mb-1 fw-500">Drag &amp; drop your PDF here</p>
                    <p class="text-secondary small mb-3">or click to browse · Max 20 MB</p>
                    <input type="file" id="fileInput" accept=".pdf" class="d-none">
                    <button id="browseBtn" class="btn btn-outline-primary btn-sm px-4">Browse Files</button>
                </div>

                <!-- File selected state -->
                <div id="fileSelected" class="d-none">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#3366CC" stroke-width="1.5" class="mb-2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                    <p id="fileName" class="fw-500 mb-1"></p>
                    <p id="fileSize" class="text-secondary small mb-0"></p>
                    <button id="removeFile" class="btn btn-link btn-sm text-danger mt-1 p-0">Remove</button>
                </div>
            </div>

            <!-- Title input + Generate button -->
            <div class="row justify-content-center mt-4">
                <div class="col-md-5 col-lg-4">
                    <input type="text" id="projectTitle" class="form-control form-control-sm mb-3"
                           placeholder="Project title (optional)">
                    <button id="generateBtn" class="btn btn-primary w-100" disabled>
                        <span id="generateText">Create Mind Map</span>
                        <span id="generateSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
                    </button>
                </div>
            </div>

            <!-- Status messages -->
            <div id="statusArea" class="mt-3"></div>
        </section>

        <hr class="my-5">

        <!-- ── Recent Projects ────────────────────────── -->
        <section>
            <div class="d-flex align-items-center justify-content-between mb-4">
                <h2 class="h5 fw-600 mb-0">Recent Projects</h2>
                <button id="refreshBtn" class="btn btn-outline-secondary btn-sm">Refresh</button>
            </div>

            <div id="projectsLoading" class="text-center py-4 text-secondary">
                <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                Loading projects…
            </div>

            <div id="projectsEmpty" class="text-center py-5 d-none">
                <p class="text-secondary mb-0">No projects yet. Upload a PDF to get started.</p>
            </div>

            <div id="projectsGrid" class="row g-3 d-none"></div>
        </section>
    </main>

    <!-- ── Footer ─────────────────────────────────────── -->
    <footer class="border-top py-4 mt-5">
        <div class="container text-center">
            <p class="text-secondary small mb-0">MindMapAI · Built with Spring Boot, Groq AI &amp; D3.js</p>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
